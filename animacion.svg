<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .cursor { animation: blink 1s step-end infinite; }
    .scanline { animation: scan 3s linear infinite; }
  </style>
  <rect width="400" height="100" fill="#0d1117" rx="8"/>
  <text x="20" y="40" fill="#4d6bfe" font-family="monospace" font-size="16">DQC Interactive</text>
  <text x="20" y="65" fill="#8b949e" font-family="monospace" font-size="14">Initializing FOSS environment...</text>
  <rect x="20" y="75" width="200" height="4" fill="#30363d" rx="2"/>
  <rect x="20" y="75" width="150" height="4" fill="#4d6bfe" rx="2"/>
  <text x="230" y="80" fill="#e6edf3" font-family="monospace" font-size="12">75%</text>
  <text x="360" y="80" fill="#e6edf3" class="cursor" font-family="monospace" font-size="14">_</text>
  <rect width="100%" height="2" fill="#4d6bfe" opacity="0.2" class="scanline" y="50"/>
</svg>
