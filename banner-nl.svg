<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="Waving Dutch flag, a terminal that types by itself and a spinning windmill">
  <defs>
    <!-- Filtro de ondeo de bandera -->
    <filter id="wave" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.02" numOctaves="1" seed="3" result="n">
        <animate attributeName="baseFrequency" dur="8s" values="0.008 0.02;0.012 0.035;0.008 0.02" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- ClipPaths para Joke 1 (Original) -->
    <clipPath id="c1_1"><rect x="306" y="72" width="0" height="20"><animate attributeName="width" begin="0s; 56s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.05;0.25;0.9;1"/></rect></clipPath>
    <clipPath id="c1_2"><rect x="306" y="96" width="0" height="20"><animate attributeName="width" begin="0s; 56s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.25;0.45;0.9;1"/></rect></clipPath>
    <clipPath id="c1_3"><rect x="306" y="120" width="0" height="20"><animate attributeName="width" begin="0s; 56s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.5;0.7;0.9;1"/></rect></clipPath>
    <clipPath id="c1_4"><rect x="306" y="144" width="0" height="20"><animate attributeName="width" begin="0s; 56s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.75;0.9;0.9;1"/></rect></clipPath>

