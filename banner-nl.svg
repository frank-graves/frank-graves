    <clipPath id="c2_2"><rect x="306" y="96" width="0" height="20"><animate attributeName="width" begin="8s; 64s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.25;0.45;0.9;1"/></rect></clipPath>
    <clipPath id="c2_3"><rect x="306" y="120" width="0" height="20"><animate attributeName="width" begin="8s; 64s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.5;0.7;0.9;1"/></rect></clipPath>
