<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="Waving Dutch flag, a terminal that types by itself and a spinning windmill" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="wave" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.02" numOctaves="1" seed="3" result="n">
        <animate attributeName="baseFrequency" dur="8s" values="0.008 0.02;0.012 0.035;0.008 0.02" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="c1"><rect x="306" y="72" width="0" height="20">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.03;0.18;0.94;1"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="306" y="96" width="0" height="20">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.21;0.33;0.94;1"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="306" y="120" width="0" height="20">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.36;0.50;0.94;1"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="306" y="144" width="0" height="20">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.53;0.65;0.94;1"/>
    </rect></clipPath>
  </defs>

  <!-- fondo -->
  <rect x="1" y="1" width="858" height="238" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- bandera -->
  <g transform="translate(30,39)" filter="url(#wave)">
    <rect width="240" height="54" fill="#AE1C28"/>
    <rect y="54" width="240" height="54" fill="#FFFFFF"/>
    <rect y="108" width="240" height="54" fill="#21468B"/>
  </g>

  <!-- terminal -->
  <rect x="290" y="36" width="400" height="168" rx="8" fill="#010409" stroke="#30363d"/>
  <circle cx="306" cy="52" r="4.5" fill="#ff5f56"/>
  <circle cx="322" cy="52" r="4.5" fill="#ffbd2e"/>
  <circle cx="338" cy="52" r="4.5" fill="#27c93f"/>
  <text x="358" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">frank@dqc:~</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
    <text x="306" y="86" clip-path="url(#c1)" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> claude "build me a website, please"</text>
    <text x="306" y="110" clip-path="url(#c2)" fill="#8b949e">&gt; compiling... no idea what's compiling</text>
    <text x="306" y="134" clip-path="url(#c3)" fill="#ffbd2e">! 0 lines written by me (skill issue)</text>
    <text x="306" y="158" clip-path="url(#c4)" fill="#3fb950">&gt; ✓ gezellig. don't touch it.</text>
    <g opacity="0">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.67;0.68;0.94;1"/>
      <text x="306" y="182" fill="#3fb950">$</text>
      <rect x="320" y="171" width="8" height="14" fill="#c9d1d9">
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.51;1"/>
      </rect>
    </g>
  </g>

  <!-- molino -->
  <line x1="715" y1="200" x2="835" y2="200" stroke="#30363d" stroke-width="2"/>
  <polygon points="745,200 805,200 790,128 760,128" fill="#21468B"/>
  <rect x="768" y="178" width="14" height="22" rx="7" fill="#0d1117"/>
  <polygon points="758,128 792,128 775,108" fill="#AE1C28"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 775 120" to="360 775 120" dur="10s" repeatCount="indefinite"/>
    <rect x="771" y="64" width="8" height="56" rx="2" fill="#dfe6ee"/>
    <rect x="775" y="116" width="56" height="8" rx="2" fill="#dfe6ee"/>
    <rect x="771" y="120" width="8" height="56" rx="2" fill="#dfe6ee"/>
    <rect x="719" y="116" width="56" height="8" rx="2" fill="#dfe6ee"/>
  </g>
  <circle cx="775" cy="120" r="6" fill="#AE1C28"/>

  <!-- pie -->
  <text x="430" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6e7681">NAP −2 m · sea level is just a suggestion</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
