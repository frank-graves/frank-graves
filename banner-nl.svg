    <clipPath id="c4_1"><rect x="306" y="72" width="0" height="20"><animate attributeName="width" begin="24s; 80s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.05;0.25;0.9;1"/></rect></clipPath>
    <clipPath id="c4_2"><rect x="306" y="96" width="0" height="20"><animate attributeName="width" begin="24s; 80s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.25;0.45;0.9;1"/></rect></clipPath>
    <clipPath id="c4_3"><rect x="306" y="120" width="0" height="20"><animate attributeName="width" begin="24s; 80s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.5;0.7;0.9;1"/></rect></clipPath>
