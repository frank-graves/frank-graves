    <clipPath id="c6_2"><rect x="306" y="96" width="0" height="20"><animate attributeName="width" begin="40s; 96s" dur="8s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.25;0.45;0.9;1"/></rect></clipPath>
