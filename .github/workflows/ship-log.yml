name: Auto-Update README

on:
  schedule:
    - cron: '0 0 * * *' # Todos los días a medianoche
  workflow_dispatch: # Permite ejecutarlo a mano

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para hacer commit de vuelta al repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ship-log.sh
          ./scripts/ship-log.sh

      - name: Commit and Push
        run: |
          git config --global user.name 'DQC Bot'
          git config --global user.email 'bot@dqc.interactive'
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update README [skip ci]"
          git push
